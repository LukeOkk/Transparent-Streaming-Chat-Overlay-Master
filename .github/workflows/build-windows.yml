name: Build Windows installer

on:
  push:
    branches:
      - main      # temporary: build on every push to main while debugging CI
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build NSIS installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
        run: |
          # Run electron-builder, capturing ALL output to a file (and the
          # console). --publish never stops it from trying to push a GitHub
          # release just because GH_TOKEN + a tag are present.
          npx electron-builder --win nsis --publish never *> build-output.log
          $code = $LASTEXITCODE
          Get-Content build-output.log
          if ($code -ne 0) {
            # Surface the tail of the real error as ::error:: annotations,
            # which are readable via the public check-runs annotations API.
            Get-Content build-output.log -Tail 30 | ForEach-Object {
              $line = ($_ -replace '::', ' : ')
              if ($line.Trim().Length -gt 0) { Write-Output "::error::$line" }
            }
            exit $code
          }

      - name: Upload electron-builder output log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output-log
          path: build-output.log
          if-no-files-found: ignore

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
