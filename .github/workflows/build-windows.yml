name: Build Windows installer

on:
  push:
    branches:
      - main      # temporary: build on every push to main while debugging CI
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # allow pushing the debug log branch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build NSIS installer
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
        run: |
          npx electron-builder --win nsis --publish never *> build-output.log
          "exit_code=$LASTEXITCODE" | Out-File -FilePath build-exit.txt -Encoding ascii
          Get-Content build-output.log
          exit $LASTEXITCODE

      - name: Publish build log to ci-debug branch (always)
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path build-output.log)) { "no log produced" | Out-File build-output.log }
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git switch --orphan ci-debug
          git add -f build-output.log build-exit.txt
          git commit -m "ci: windows build log"
          git push -f origin ci-debug

      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
