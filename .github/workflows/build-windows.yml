name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build NSIS installer
        env:
          # No code-signing certificate in CI — don't let electron-builder
          # try to auto-discover one (would fail on the clean runner).
          CSC_IDENTITY_AUTO_DISCOVERY: false
        # --publish never stops electron-builder from trying to create a
        # GitHub Release on tag builds (that auto-publish was the original
        # cause of the build-step failure).
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
