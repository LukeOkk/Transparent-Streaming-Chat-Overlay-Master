<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Setup — Transparent Streaming Chat</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      margin: 0;
      padding: 26px;
      background: #1e1e22;
      color: #f5f5f7;
    }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p  { font-size: 13px; margin: 0 0 16px; color: #aab; line-height: 1.4; }
    label { display: block; font-size: 12px; color: #aab; margin: 14px 0 6px; }
    .platform-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .platform-card {
      padding: 12px 6px;
      background: #2a2a31;
      border: 2px solid #3a3a42;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
      user-select: none;
    }
    .platform-card.active { border-color: #6c5ce7; background: #34344a; }
    .platform-card:hover { border-color: #6c5ce7; }
    .platform-card .icon { font-size: 22px; display: block; margin-bottom: 4px; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 14px;
      background: #2a2a31;
      color: #f5f5f7;
      border: 1px solid #3a3a42;
      border-radius: 6px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #6c5ce7; }
    .hint { font-size: 11px; color: #778; margin-top: 6px; }
    .row { display: flex; gap: 8px; margin-top: 20px; }
    button {
      flex: 1;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      background: #6c5ce7;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #7a6bf0; }
    button.secondary { background: #2a2a31; color: #aab; }
    button.secondary:hover { background: #3a3a42; }
    .error { color: #ff6b6b; font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>Welcome 👋</h1>
  <p>Pick a platform and enter the channel (or a custom URL) you want to display as a transparent overlay.</p>

  <label>Platform</label>
  <div class="platform-grid">
    <div class="platform-card active" data-platform="twitch">
      <span class="icon">🟣</span>Twitch
    </div>
    <div class="platform-card" data-platform="kick">
      <span class="icon">🟢</span>Kick
    </div>
    <div class="platform-card" data-platform="youtube">
      <span class="icon">🔴</span>YouTube
    </div>
    <div class="platform-card" data-platform="custom">
      <span class="icon">🌐</span>Custom URL
    </div>
  </div>

  <label id="inputLabel" for="ch">Channel name</label>
  <input id="ch" type="text" placeholder="e.g. shroud" autofocus autocomplete="off" />
  <div class="hint" id="hint"></div>
  <div class="error" id="err"></div>

  <div class="row">
    <button class="secondary" id="cancel">Cancel</button>
    <button id="ok">Save &amp; Launch</button>
  </div>

  <script>
    const HINTS = {
      twitch:  'Just the channel name — e.g. "shroud".',
      kick:    'Just the channel name — e.g. "trainwreckstv".',
      youtube: 'Paste the YouTube live URL or just the 11-char video ID.',
      custom:  'Paste any full URL (KapChat, jChat, OBS browser source, etc.).'
    };
    const LABELS = {
      twitch:  'Channel name',
      kick:    'Channel name',
      youtube: 'Live video URL or ID',
      custom:  'Full URL'
    };
    const PLACEHOLDERS = {
      twitch:  'e.g. shroud',
      kick:    'e.g. trainwreckstv',
      youtube: 'https://www.youtube.com/watch?v=… or video ID',
      custom:  'https://…'
    };

    let platform = 'twitch';
    const input     = document.getElementById('ch');
    const inputLbl  = document.getElementById('inputLabel');
    const hint      = document.getElementById('hint');
    const err       = document.getElementById('err');
    const okBtn     = document.getElementById('ok');
    const cxBtn     = document.getElementById('cancel');

    function applyPlatform(p) {
      platform = p;
      document.querySelectorAll('.platform-card').forEach(c => {
        c.classList.toggle('active', c.dataset.platform === p);
      });
      inputLbl.textContent  = LABELS[p];
      input.placeholder     = PLACEHOLDERS[p];
      hint.textContent      = HINTS[p];
      input.value = '';
      input.focus();
    }

    document.querySelectorAll('.platform-card').forEach((card) => {
      card.addEventListener('click', () => applyPlatform(card.dataset.platform));
    });
    applyPlatform('twitch');

    async function save() {
      err.textContent = '';
      const value = input.value.trim();
      if (!value) { err.textContent = 'Please fill the field above.'; return; }
      const res = await window.tscoSetup.save({ platform, channel: value });
      if (!res.ok) { err.textContent = res.error; return; }
      await window.tscoSetup.done();
    }

    okBtn.addEventListener('click', save);
    cxBtn.addEventListener('click', () => window.close());
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
  </script>
</body>
</html>
